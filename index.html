/* Layout: one column of dated work on a phone; the work list plus a deadline rail on a laptop. */
:root {
  --bg: #F2F5F6; --surface: #FFFFFF; --ink: #14232A; --muted: #55676F; --line: #D7E0E3;
  --accent: #0B6B66; --accent-ink: #FFFFFF; --accent-soft: #DDEFEE;
  --good: #1B7A4C; --good-bg: #E1F2E8; --warn: #8A5A00; --warn-bg: #FFEFD0; --crit: #B3261E; --crit-bg: #FBE3E1;
  --display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1618; --surface: #162226; --ink: #E5EDEF; --muted: #9BABB2; --line: #2B3A3F;
    --accent: #5CC8C0; --accent-ink: #062321; --accent-soft: #173A39;

}
:root[data-theme="dark"] {
  --bg: #0E1618; --surface: #162226; --ink: #E5EDEF; --muted: #9BABB2; --line: #2B3A3F;
  --accent: #5CC8C0; --accent-ink: #062321; --accent-soft: #173A39;
  --good: #72D09A; --good-bg: #153424; --warn: #F2B95F; --warn-bg: #3A2C0E; --crit: #F5928A; --crit-bg: #41201D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 17px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 500; }
p { margin: 0; }
.top { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; }
.dateline { color: var(--muted); }

input[type="text"], input[type="date"], select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; width: 100%; }

@media (prefers-reduced-motion: no-preference) { .list > li, .card { transition: background-color .15s; } }

<div class="wrap">
  <header class="top">
    <div>
      <h1>Scholarship Tracker</h1>
      <p class="dateline" id="dateline"></p>
    </div>
    <p class="sync" id="sync" role="status"></p>
  </header>
  <nav class="tabs" aria-label="Sections">
    <a href="#today" data-view="today">Today</a>
    <a href="#plan" data-view="plan">Plan</a>
    <a href="#documents" data-view="documents">Documents</a>
    <a href="#programmes" data-view="programmes">Programmes</a>
  </nav>
  <main class="view" id="view"></main>
</div>
<div class="toast" id="toast" role="alert" hidden></div>

<script>
(function () {
  "use strict";
  var VIEWS = ["today", "plan", "documents", "programmes"];
  var TRACK = { none: "No IELTS needed", ielts: "Needs IELTS", both: "Both tracks" };
  var DOC_GROUPS = [
    ["start", "To start applying now, without IELTS"],
    ["funded", "For the fully funded programmes (these also need IELTS)"]
  ];
  var PROG_GROUPS = [
    ["moi", "Apply now, without IELTS", "Your MOI certificate is accepted, or no English proof is needed to apply."],
    ["ielts", "Needs IELTS", "Your MOI is not accepted. Book and take IELTS first."],
    ["ask", "Not confirmed: ask first", "The rule for an MOI is not stated. Email the programme before you rely on it."]
  ];
  var DOC_STATUS = [["have", "Have it"], ["progress", "In progress"], ["todo", "To do"]];
  var PROG_STATUS = [["not_started", "Not started"], ["in_progress", "In progress"], ["submitted", "Submitted"], ["skipped", "Not applying"]];

  var S = {
    db: null, ready: { tasks: false, documents: false, programmes: false }, slow: false, dead: false, readOnly: false,
    tasks: [], documents: [], programmes: [], settings: { ieltsDate: "", ieltsScore: "" },
    busy: {}, pendingDelete: "",
    ui: { filter: "all", habits: false, hideDone: false },
    draft: { title: "", date: "", ieltsDate: null, ieltsScore: null }
  };
  try { var saved = JSON.parse(localStorage.getItem("st-ui") || "null"); if (saved) { S.ui.filter = saved.filter || "all"; S.ui.habits = !!saved.habits; S.ui.hideDone = !!saved.hideDone; } } catch (e) {}
  function saveUi() { try { localStorage.setItem("st-ui", JSON.stringify(S.ui)); } catch (e) {} }

  var $view = document.getElementById("view"), $sync = document.getElementById("sync"), $toast = document.getElementById("toast");

  /* ---------- dates (all in Dhaka time) ---------- */
  function today() {
    try { return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Dhaka", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }
    catch (e) { return new Date(Date.now() + 6 * 3600e3).toISOString().slice(0, 10); }
  }
  function toUtc(d) { var p = d.split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function diff(a, b) { return Math.round((toUtc(a) - toUtc(b)) / 86400e3); }
  function addDays(d, n) { return new Date(toUtc(d) + n * 86400e3).toISOString().slice(0, 10); }
  function fmt(d, long) {
    if (!d) return "";
    var o = { timeZone: "UTC", weekday: "short", day: "numeric", month: "short" };
    if (long || d.slice(0, 4) !== today().slice(0, 4)) o.year = "numeric";
    return new Intl.DateTimeFormat("en-GB", o).format(new Date(toUtc(d)));
  }
  function monday(d) { var w = new Date(toUtc(d)).getUTCDay(); return addDays(d, -((w + 6) % 7)); }
  function daysLeft(d) {
    var n = diff(d, today());
    if (n < 0) return ["Closed", ""];
    if (n === 0) return ["Today", "crit"];
    if (n === 1) return ["Tomorrow", "crit"];
    return [n + " days left", n <= 7 ? "crit" : n <= 21 ? "warn" : ""];
  }

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function chip(text, cls) { return '<span class="chip' + (cls ? " " + cls : "") + '">' + esc(text) + "</span>"; }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function byOrder(a, b) { return (a.order || 0) - (b.order || 0); }
  function byDate(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : byOrder(a, b); }
  function options(list, value) { return list.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === value ? " selected" : "") + ">" + esc(o[1]) + "</option>"; }).join(""); }
  function dis() { return S.readOnly || !S.db ? " disabled" : ""; }
  var toastTimer = 0;
  function toast(msg) { $toast.textContent = msg; $toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { $toast.hidden = true; }, 4000); }
  function currentView() { var h = (location.hash || "").replace("#", ""); return VIEWS.indexOf(h) >= 0 ? h : "today"; }
  function allReady() { return S.ready.tasks && S.ready.documents && S.ready.programmes; }

  /* ---------- rows ---------- */
  function taskRow(t, showDate) {
    var td = today(), chips = "";
    if (showDate) chips += chip(fmt(t.date), !t.done && t.date < td ? "crit" : "");
    if (t.kind !== "habit") chips += chip(TRACK[t.track] || TRACK.both, t.track === "none" ? "good" : t.track === "ielts" ? "accent" : "");
    if (t.programme) chips += chip(t.programme);
    if (t.custom) chips += chip("Added by you");
    var del = "";
    if (t.custom) del = '<button type="button" class="small" data-act="del-task" data-id="' + esc(t.id) + '"' + dis() + ">" + (S.pendingDelete === t.id ? "Tap again to remove" : "Remove") + "</button>";
    return '<li class="' + (t.done ? "done" : "") + '"><input type="checkbox" id="chk-' + esc(t.id) + '" data-act="toggle" data-id="' + esc(t.id) + '"' + (t.done ? " checked" : "") + (S.busy["tasks/" + t.id] ? " disabled" : dis()) + ">" +
      '<label class="row-main" for="chk-' + esc(t.id) + '"><span class="row-title">' + esc(t.title) + "</span>" +
      (t.detail ? '<span class="row-detail">' + esc(t.detail) + "</span>" : "") + '<span class="chips">' + chips + "</span></label>" + del + "</li>";
  }
  function listOf(tasks, showDate) { return '<ul class="list">' + tasks.map(function (t) { return taskRow(t, showDate); }).join("") + "</ul>"; }
  function section(title, count, body) { return '<section class="sec"><div class="sec-head"><h2>' + esc(title) + "</h2>" + (count !== "" ? '<span class="count">' + esc(count) + "</span>" : "") + "</div>" + body + "</section>"; }

  /* ---------- views ---------- */
  function viewToday() {
    var td = today(), week = addDays(td, 7);
    var overdue = S.tasks.filter(function (t) { return !t.done && t.date < td && t.kind !== "habit"; }).sort(byDate);
    var now = S.tasks.filter(function (t) { return t.date === td; }).sort(byOrder);
    var next = S.tasks.filter(function (t) { return !t.done && t.date > td && t.date <= week && t.kind !== "habit"; }).sort(byDate);
    var left = "";
    var booked = S.settings.ieltsDate || S.tasks.some(function (t) { return t.id === "t-ielts-book" && t.done; });
    if (!booked) left += '<p class="alert">IELTS is not booked yet. EDISS and most fully funded programmes need the result by early January.</p>';
    if (overdue.length) left += section("Overdue", overdue.length + " to catch up", listOf(overdue, true));
    left += section("Today", now.length ? now.filter(function (t) { return t.done; }).length + " of " + now.length + " done" : "",
      now.length ? listOf(now, false) : '<p class="note">Nothing is planned for today. Use the time for an overdue task, or rest.</p>');
    if (next.length) {
      var body = "", last = "";
      next.forEach(function (t, i) {
        if (t.date !== last) { if (last) body += "</ul>"; body += '<p class="daylabel">' + esc(fmt(t.date)) + '</p><ul class="list">'; last = t.date; }
        body += taskRow(t, false);
        if (i === next.length - 1) body += "</ul>";
      });
      left += section("Next 7 days", plural(next.length, "task"), body);
    }

    var dls = S.programmes.filter(function (p) { return p.deadline && p.deadline >= td && p.status !== "submitted" && p.status !== "skipped"; })
      .sort(function (a, b) { return a.deadline < b.deadline ? -1 : a.deadline > b.deadline ? 1 : byOrder(a, b); }).slice(0, 5);
    var rail = '<section class="panel"><h2>Next deadlines</h2>' + (dls.length ? '<ul class="dl">' + dls.map(function (p) {
      var dl = daysLeft(p.deadline);
      return '<li><span class="dl-name">' + esc(p.name) + '<span class="dl-date">' + esc(fmt(p.deadline, true)) + (p.when ? ". " + esc(p.when) : "") + "</span></span>" + chip(dl[0], dl[1]) + "</li>";
    }).join("") + "</ul>" : '<p class="row-detail">No open deadlines.</p>') + "</section>";

    var iDate = S.draft.ieltsDate != null ? S.draft.ieltsDate : S.settings.ieltsDate || "";
    var iScore = S.draft.ieltsScore != null ? S.draft.ieltsScore : S.settings.ieltsScore || "";
    var iNote = S.settings.ieltsDate ? (diff(S.settings.ieltsDate, td) >= 0 ? "Test in " + diff(S.settings.ieltsDate, td) + " days." : "Test date has passed. Add your score when it arrives.") : "Target: 6.5 overall, no band below 6.0.";
    rail += '<section class="panel"><h2>IELTS</h2><p class="row-detail">' + esc(iNote) + '</p><form data-form="ielts"><div class="fields">' +
      '<label class="field">Test date<input type="date" id="ielts-date" data-draft="ieltsDate" value="' + esc(iDate) + '"' + dis() + "></label>" +
      '<label class="field">Overall score<input type="text" id="ielts-score" data-draft="ieltsScore" inputmode="decimal" placeholder="e.g. 7.0" value="' + esc(iScore) + '"' + dis() + "></label>" +
      '</div><button class="primary" type="submit"' + dis() + ">Save IELTS details</button></form></section>";

    rail += '<section class="panel"><h2>Add your own task</h2><form data-form="add"><label class="field">What to do<input type="text" id="add-title" data-draft="title" maxlength="140" value="' + esc(S.draft.title) + '"' + dis() + "></label>" +
      '<label class="field">On which day<input type="date" id="add-date" data-draft="date" value="' + esc(S.draft.date || td) + '"' + dis() + "></label>" +
      '<button class="primary" type="submit"' + dis() + ">Add task</button></form></section>";

    rail += backupPanel();
    return '<div class="cols"><div class="stack">' + left + '</div><div class="stack">' + rail + "</div></div>";
  }

  function viewPlan() {
    var f = S.ui.filter;
    var list = S.tasks.filter(function (t) {
      if (t.kind === "habit" && !S.ui.habits) return false;
      if (S.ui.hideDone && t.done) return false;
      if (f === "none") return t.track === "none" || t.track === "both";
      if (f === "ielts") return t.track === "ielts" || t.track === "both";
      return true;
    }).sort(byDate);
    var real = S.tasks.filter(function (t) { return t.kind !== "habit"; });
    var html = '<section class="sec"><div class="sec-head"><h2>Whole plan</h2><span class="count">' + real.filter(function (t) { return t.done; }).length + " of " + real.length + " tasks done</span></div>" +
      '<div class="filters">' + [["all", "All"], ["none", "No IELTS needed"], ["ielts", "Needs IELTS"]].map(function (o) {
        return '<button type="button" data-act="filter" data-id="' + o[0] + '" aria-pressed="' + (f === o[0]) + '">' + o[1] + "</button>";
      }).join("") +
      '<label class="toggle"><input type="checkbox" id="tg-habits" data-act="tg-habits"' + (S.ui.habits ? " checked" : "") + ">Show daily IELTS mock tests</label>" +
      '<label class="toggle"><input type="checkbox" id="tg-done" data-act="tg-done"' + (S.ui.hideDone ? " checked" : "") + ">Hide done</label></div></section>";
    if (!list.length) return html + '<p class="note">No tasks match this filter.</p>';
    var weeks = {}, order = [];
    list.forEach(function (t) { var m = monday(t.date); if (!weeks[m]) { weeks[m] = []; order.push(m); } weeks[m].push(t); });
    var thisWeek = monday(today());
    order.forEach(function (m) {
      html += section(m === thisWeek ? "This week" : "Week of " + fmt(m, true).replace(/^\w+,? /, ""), plural(weeks[m].length, "task"), listOf(weeks[m], true));
    });
    return html;
  }

  function viewDocuments() {
    var have = S.documents.filter(function (d) { return d.status === "have"; }).length;
    var html = '<p class="note"><strong>' + have + " of " + S.documents.length + " collected.</strong> Change a status when you get a document. The first group is enough to apply where your MOI is accepted.</p>";
    DOC_GROUPS.forEach(function (g) {
      var docs = S.documents.filter(function (d) { return d.group === g[0]; }).sort(byOrder);
      if (!docs.length) return;
      html += section(g[1], docs.filter(function (d) { return d.status === "have"; }).length + " of " + docs.length, '<ul class="list">' + docs.map(function (d) {
        var c = d.status === "have" ? chip("Have it ✓", "good") : d.status === "progress" ? chip("In progress", "warn") : chip("To do");
        return '<li class="docrow"><span class="row-main"><span class="row-title">' + esc(d.name) + "</span>" + (d.note ? '<span class="row-detail">' + esc(d.note) + "</span>" : "") + '<span class="chips">' + c + "</span></span>" +
          '<select id="doc-' + esc(d.id) + '" data-act="doc-status" data-id="' + esc(d.id) + '" aria-label="Status of ' + esc(d.name) + '"' + (S.busy["documents/" + d.id] ? " disabled" : dis()) + ">" + options(DOC_STATUS, d.status) + "</select></li>";
      }).join("") + "</ul>");
    });
    return html;
  }

  function viewProgrammes() {
    var html = "";
    PROG_GROUPS.forEach(function (g) {
      var ps = S.programmes.filter(function (p) { return p.group === g[0]; }).sort(function (a, b) {
        var x = a.deadline || "9999", y = b.deadline || "9999"; return x < y ? -1 : x > y ? 1 : byOrder(a, b);
      });
      if (!ps.length) return;
      html += section(g[1], plural(ps.length, "programme"), '<p class="row-detail">' + esc(g[2]) + '</p><div class="cards">' + ps.map(function (p) {
        var dl = p.deadline ? daysLeft(p.deadline) : ["No date yet", "warn"];
        if (p.status === "submitted") dl = ["Submitted ✓", "good"];
        if (p.status === "skipped") dl = ["Not applying", ""];
        var opens = p.opens ? (p.opens > today() ? "Opens " + fmt(p.opens, true) : "Open now") : "";
        return '<article class="card"><div class="card-head"><h3>' + esc(p.name) + "</h3>" + chip(dl[0], dl[1]) + '</div><dl class="kv">' +
          "<dt>Deadline</dt><dd>" + esc(p.deadline ? fmt(p.deadline, true) : "Not published") + (p.when ? ". " + esc(p.when) : "") + "</dd>" +
          (opens ? "<dt>Portal</dt><dd>" + esc(opens) + "</dd>" : "") +
          "<dt>Where</dt><dd>" + esc(p.country) + "</dd><dt>English</dt><dd>" + esc(p.english) + "</dd><dt>Funding</dt><dd>" + esc(p.funding) + "</dd></dl>" +
          (p.confirm ? '<p class="confirm">Check: ' + esc(p.confirm) + "</p>" : "") +
          (/^https:\/\//.test(p.url || "") ? '<p><a class="ext" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer">Official page: ' + esc(p.url.replace(/^https:\/\/(www\.)?/, "").split("/")[0]) + " ↗</a></p>" : "") +
          '<label class="field">My status<select class="status-sel" id="prog-' + esc(p.id) + '" data-act="prog-status" data-id="' + esc(p.id) + '"' + (S.busy["programmes/" + p.id] ? " disabled" : dis()) + ">" + options(PROG_STATUS, p.status) + "</select></label></article>";
      }).join("") + "</div>");
    });
    return html;
  }

  /* ---------- render ---------- */
  var queued = false;
  function render() {
    if (queued) return; queued = true;
    var ran = false, run = function () { if (ran) return; ran = true; queued = false; paint(); };
    requestAnimationFrame(run); setTimeout(run, 150); /* the timer covers a tab whose frames are paused */
  }
  function paint() {
    var v = currentView();
    Array.prototype.forEach.call(document.querySelectorAll(".tabs a"), function (a) {
      if (a.getAttribute("data-view") === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    document.getElementById("dateline").textContent = fmt(today(), true) + ", Dhaka time";
    var a = document.activeElement, keep = a && a.id && $view.contains(a) ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
    var html;
    if (S.dead) html = '<p class="note"><strong>Your plan cannot be loaded here.</strong> Open this page in Claude while signed in to your account. Your progress is saved to your account, not to this device.</p>';
    else if (!allReady()) html = '<p class="note">' + (S.slow ? "<strong>Your data can't be reached yet.</strong> Check your connection. The page keeps trying." : "Loading your plan…") + "</p>";
    else if (!S.tasks.length && !S.documents.length && !S.programmes.length) html = '<p class="note"><strong>Your plan has not been loaded yet.</strong> Tasks, documents and programmes will appear here once Claude adds them. You can already add your own tasks from the Today tab.</p>' + (v === "today" ? viewToday() : "");
    else html = v === "plan" ? viewPlan() : v === "documents" ? viewDocuments() : v === "programmes" ? viewProgrammes() : viewToday();
    $view.innerHTML = html;
    if (keep) { var el = document.getElementById(keep.id); if (el) { el.focus(); try { if (keep.s != null) el.setSelectionRange(keep.s, keep.e); } catch (e) {} } }
    var pending = Object.keys(S.busy).length;
    $sync.className = "sync" + (S.readOnly || S.slow || !window.__local.persistent() ? " bad" : "");
    $sync.textContent = S.dead ? "" : S.readOnly ? "Read only: changes are not saved" : S.slow ? "Not connected" : pending ? "Saving…" : allReady() ? (window.__local.persistent() ? "Saved on this device" : "Not saved: this browser blocks storage. Save a backup file.") : "";
  }

  /* ---------- writes (one at a time per document) ---------- */
  function write(path, fn) {
    if (!S.db || S.readOnly || S.busy[path]) return Promise.resolve(false);
    S.busy[path] = true; render();
    return fn().then(function () { return true; }, function (e) {
      if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) S.readOnly = true;
      toast(S.readOnly ? "This view cannot save changes." : "Could not save. Check your connection and try again.");
      return false;
    }).then(function (ok) { delete S.busy[path]; render(); return ok; });
  }
  function find(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }

  $view.addEventListener("change", function (ev) {
    var el = ev.target, act = el.getAttribute("data-act"), id = el.getAttribute("data-id");
    if (act === "toggle") {
      var t = find(S.tasks, id); if (!t) return;
      var done = el.checked;
      write("tasks/" + id, function () { return S.db.doc("tasks/" + id).update({ done: done, doneAt: done ? new Date().toISOString() : "" }); });
    } else if (act === "doc-status") {
      var v = el.value; write("documents/" + id, function () { return S.db.doc("documents/" + id).update({ status: v }); });
    } else if (act === "prog-status") {
      var s = el.value; write("programmes/" + id, function () { return S.db.doc("programmes/" + id).update({ status: s }); });
    } else if (act === "tg-habits") { S.ui.habits = el.checked; saveUi(); render(); }
    else if (act === "tg-done") { S.ui.hideDone = el.checked; saveUi(); render(); }
  });
  $view.addEventListener("input", function (ev) { var k = ev.target.getAttribute("data-draft"); if (k) S.draft[k] = ev.target.value; });
  $view.addEventListener("click", function (ev) {
    var el = ev.target.closest("button[data-act]"); if (!el) return;
    var act = el.getAttribute("data-act"), id = el.getAttribute("data-id");
    if (act === "filter") { S.ui.filter = id; saveUi(); render(); }
    else if (act === "del-task") {
      if (S.pendingDelete !== id) { S.pendingDelete = id; render(); return; }
      S.pendingDelete = "";
      write("tasks/" + id, function () { return S.db.doc("tasks/" + id).delete(); });
    }
  });
  $view.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var kind = ev.target.getAttribute("data-form");
    if (kind === "add") {
      var title = (S.draft.title || "").trim(), date = S.draft.date || today();
      if (!title) { toast("Write what the task is first."); return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast("Choose a day for the task."); return; }
      var ref = S.db && S.db.collection("tasks").doc();
      if (!ref) return;
      write("tasks/" + ref.id, function () {
        return ref.set({ title: title, detail: "", date: date, track: "both", programme: "", kind: "task", done: false, doneAt: "", custom: true, order: Date.now() });
      }).then(function (ok) { if (ok) { S.draft.title = ""; S.draft.date = ""; toast("Task added for " + fmt(date) + "."); render(); } });
    } else if (kind === "ielts") {
      var d = S.draft.ieltsDate != null ? S.draft.ieltsDate : S.settings.ieltsDate || "";
      var sc = (S.draft.ieltsScore != null ? S.draft.ieltsScore : S.settings.ieltsScore || "").trim();
      write("settings/main", function () { return S.db.doc("settings/main").set({ ieltsDate: d, ieltsScore: sc }); })
        .then(function (ok) { if (ok) { S.draft.ieltsDate = null; S.draft.ieltsScore = null; toast("IELTS details saved."); render(); } });
    }
  });
  window.addEventListener("hashchange", function () { S.pendingDelete = ""; paint(); window.scrollTo(0, 0); });

  /* ---------- backup (stand-alone copy only) ---------- */
  function dhakaDay(iso) {
    try { return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Dhaka", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(iso)); } catch (e) { return ""; }
  }
  function backupPanel() {
    var h = '<section class="panel"><h2>Backup</h2><p class="row-detail">Your progress is saved in this browser, on this device only. Save a backup file now and then. Use it to move your progress to another device or browser.</p>';
    if (S.pendingImport) {
      var i = S.pendingImport.info, day = i.savedAt ? dhakaDay(i.savedAt) : "";
      h += '<p class="confirm">Backup from ' + esc(day ? fmt(day, true) : "an unknown date") + ": " + esc(i.done + " of " + i.total) + " tasks done. Restoring replaces everything saved on this device.</p>" +
        '<div class="filters"><button type="button" class="primary" data-act="backup-apply">Replace my progress</button><button type="button" data-act="backup-cancel">Cancel</button></div>';
    } else {
      h += '<div class="filters"><button type="button" class="primary" data-act="backup-save">Save a backup file</button>' +
        '<label class="btnlike">Restore from a backup file<input class="vh" type="file" accept=".json,application/json" data-act="backup-file"></label></div>';
    }
    return h + "</section>";
  }
  function saveBackup() {
    var name = "scholarship-progress-" + today() + ".json";
    try {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([window.__local.exportText()], { type: "application/json" }));
      a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      toast("Backup saved as " + name + ".");
    } catch (e) { toast("This browser could not save the file."); }
  }
  $view.addEventListener("click", function (ev) {
    var el = ev.target.closest("button[data-act]"); if (!el) return;
    var act = el.getAttribute("data-act");
    if (act === "backup-save") saveBackup();
    else if (act === "backup-cancel") { S.pendingImport = null; render(); }
    else if (act === "backup-apply" && S.pendingImport) {
      var ok = window.__local.importText(S.pendingImport.text);
      S.pendingImport = null; toast(ok ? "Backup restored." : "That backup could not be restored."); render();
    }
  });
  $view.addEventListener("change", function (ev) {
    var el = ev.target; if (el.getAttribute("data-act") !== "backup-file" || !el.files || !el.files[0]) return;
    var f = el.files[0]; if (f.size > 5e6) { toast("That file is too big to be a backup."); return; }
    var r = new FileReader();
    r.onload = function () {
      var info = window.__local.check(String(r.result));
      if (!info) { toast("That file is not a Scholarship Tracker backup."); return; }
      S.pendingImport = { text: String(r.result), info: info }; render();
    };
    r.onerror = function () { toast("The file could not be read."); };
    r.readAsText(f);
  });

  /* ---------- data ---------- */
  function start(db) {
    if (!db) { S.dead = true; paint(); return; }
    S.db = db;
    var timer = setTimeout(function () { if (!allReady()) { S.slow = true; render(); } }, 10000);
    function settle() { if (allReady()) { clearTimeout(timer); S.slow = false; } }
    function fail() { clearTimeout(timer); S.ready.tasks = S.ready.documents = S.ready.programmes = true; S.readOnly = true; S.slow = true; render(); }
    ["tasks", "documents", "programmes"].forEach(function (name) {
      db.collection(name).onSnapshot(function (snap) {
        S[name] = snap.docs.map(function (d) { var o = {}, b = d.data() || {}; for (var k in b) o[k] = b[k]; o.id = d.id; return o; });
        S.ready[name] = true; settle(); render();
      }, fail);
    });
    db.doc("settings/main").onSnapshot(function (snap) {
      var b = snap.exists ? snap.data() || {} : {};
      S.settings = { ieltsDate: b.ieltsDate || "", ieltsScore: b.ieltsScore || "" }; render();
    }, function () {});
  }
  paint();
  if (window.claude && typeof window.claude.use === "function") window.claude.use("db").then(start, function () { start(null); });
  else start(null);
  setInterval(function () { if (document.getElementById("dateline").textContent.indexOf(fmt(today(), true)) !== 0) paint(); }, 60000);
})();
</script>

<script>if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });</script>
